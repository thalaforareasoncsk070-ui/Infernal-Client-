name: Infernal Client 2.0 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded project ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            ls -la
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -200

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Find Gradle project
        id: gradle
        shell: bash
        run: |
          GRADLEW=$(find project -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "Project contents:"
            find project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper: $GRADLEW"
          echo "Project directory: $PROJECT_DIR"

          echo "gradlew=$GRADLEW" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Infernal Client
        shell: bash
        run: |
          chmod +x "${{ steps.gradle.outputs.gradlew }}"
          cd "${{ steps.gradle.outputs.project_dir }}"
          ./gradlew clean build --no-daemon

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: Infernal-Client-2.0
          path: "${{ steps.gradle.outputs.project_dir }}/build/libs/*.jar"
          if-no-files-found: error
