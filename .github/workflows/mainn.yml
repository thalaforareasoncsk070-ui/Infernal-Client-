name: Infernal Client 2.2 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Infernal project ZIP not found."
            ls -la
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Infernal project
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d project

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Infernal Client 2.2
        shell: bash
        run: |
          GRADLE_PROJECT=$(find project -name "build.gradle" -o -name "build.gradle.kts" | head -1)

          if [ -z "$GRADLE_PROJECT" ]; then
            echo "ERROR: Gradle build file not found."
            find project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_PROJECT")
          echo "Building from: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle clean build --no-daemon

      - name: Find compiled JAR
        id: jar
        shell: bash
        run: |
          JAR_FILE=$(find project -type f -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -print -quit)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No compiled JAR was produced."
            find project -type f -name "*.jar"
            exit 1
          fi

          echo "JAR: $JAR_FILE"
          echo "jar_file=$JAR_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Infernal Client 2.2 JAR
        uses: actions/upload-artifact@v4
        with:
          name: Infernal-Client-2.2
          path: ${{ steps.jar.outputs.jar_file }}
          if-no-files-found: error
